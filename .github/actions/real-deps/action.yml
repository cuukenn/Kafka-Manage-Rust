# T112: 构建 --features real 所需的系统依赖，CI 与 release 共用一份。
# T119: OpenSSL 改走 rdkafka 的 ssl-vendored（从源码编、静态链进二进制）。
# T122: Windows 上编 OpenSSL 需要 core 模块齐全的 perl —— runner PATH 上那个是裁剪过的。
# T123: 用 OPENSSL_SRC_PERL 显式给出 perl 的绝对路径，不靠 PATH 顺序（build 步跑在 bash 下会重排 PATH）。
name: real-driver deps
description: 构建 --features real 所需的系统依赖
runs:
  using: composite
  steps:
    - name: Linux 系统依赖
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # webkit/gtk/rsvg 是 tao+wry 的编译期与运行期依赖。
        # 不再装 libssl-dev：装了也不会用（vendored 的 root 排在 CMAKE_PREFIX_PATH 最前），
        # 留着只会让「产物链了系统 OpenSSL」这件事重新变得不可见。
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
          pkg-config cmake build-essential perl

    - name: Perl（Windows · openssl-src 要编 OpenSSL）
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # v0.1.5 第二/三轮的失败正文：Can't locate Locale/Maketext/Simple.pm in @INC
        # （@INC 里是 /usr/lib/perl5/core_perl 这类 MSYS 路径）⇒ 用的是 Git for Windows
        # 带的裁剪 perl，OpenSSL 的 ./Configure 直接 exit 2。Strawberry 的 core 模块齐全。
        # 第三轮证明 PATH 顺序不是杠杆：这一步已把 Strawberry 排到最前（notice 可证），
        # 但 build 步跑在 bash 下，Git Bash 会再把自己的 /usr/bin 插到最前。
        # openssl-src src/lib.rs:158 = OPENSSL_SRC_PERL → PERL → 裸 "perl"，给它绝对路径。
        $straw = "C:\Strawberry\perl\bin\perl.exe"
        if (-not (Test-Path $straw)) {
          choco install strawberryperl -y --no-progress --limit-output | Out-Null
        }
        if (-not (Test-Path $straw)) { throw "Strawberry perl 没装上：$straw 不存在" }
        "C:\Strawberry\c\bin", "C:\Strawberry\perl\site\bin", "C:\Strawberry\perl\bin" |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "OPENSSL_SRC_PERL=$straw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # 自检放在这里：缺模块就当场红，别让它变成 openssl-src 的一句 'perl' reported failure。
        & $straw -MLocale::Maketext::Simple -e "exit 0"
        if ($LASTEXITCODE -ne 0) { throw "Strawberry perl 缺 Locale::Maketext::Simple" }
        $pathPerl = (where.exe perl | Select-Object -First 1)
        Write-Host "::notice::OPENSSL_SRC_PERL=$straw | PATH resolves perl to $pathPerl"
