name: CI

# T092: release.yml is the only workflow and it only fires on `v*` tags, so a
# push never runs a test and the three platforms' build health stays unknown
# until release day. This workflow is the per-push gate; release.yml keeps the
# packaging job and its `contents: write` (R97).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the other two.
      fail-fast: false
      matrix:
        # Pinned to the release workflow's targets (R98) so CI and release build
        # the same images. T109: macos-14 → macos-15（macos-14 于 2026-11-02 退役）。
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # tao/wry link against the system webview; rdkafka and rusqlite need a C
      # toolchain. Same list T093 documents for Linux developers.
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            pkg-config cmake build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: actions/setup-node@v4
        with:
          # Vite 7 refuses anything below 20.19/22.12.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # main-bin embeds frontend/dist with include_dir!, so the frontend has to
      # exist before the Rust build looks at it.
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # T120: 匿名身份读不到 job 日志（logs 端点 404），但 annotations 读得到。
      # T129: 上一版只捞得到 `test ... FAILED` 与 `failures:` 两类行，真正的 assertion diff 一直拿不到
      # —— libtest 把失败详情放在 `failures:` 之后，而 CARGO_TERM_COLOR=always 的 ANSI 码让 `---- `
      # 那类行匹配不上 ^ 锚点；一次 run 又只留下 10 条 annotation。
      # 现在：去色 → 从第一个 `failures:` 取到末尾 → 压成**一条**多行 annotation（换行用 %0A）。
      - name: 测试
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' test.log > test.plain.log
            block=$(awk '/^failures:/{f=1} f' test.plain.log | head -n 35 | cut -c1-200)
            block="${block//%/%25}"; block="${block//:/%3A}"; block="${block//=/%3D}"
            block="${block//$'\n'/%0A}"
            printf '::error::cargo test failed: %s\n' "$block"
          fi
          exit "$status"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 构建可执行文件
        run: cargo build --release -p main-bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-main-bin
          path: |
            target/release/main-bin
            target/release/main-bin.exe
          if-no-files-found: error

  # Keeps the rdkafka path compiling without a live broker: real_conformance is
  # #[ignore]d and needs the Docker cluster (R100).
  # T112: 这条 job 以前只跑 `cargo check`（不链接），于是「real 编不过」只有打 tag 才暴露
  # （v0.1.1 的 4/5 平台就是这么红的）。现在改用与 release 相同的依赖动作，并真实链接。
  real-check:
    name: real feature check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/real-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 构建 real 驱动（真实链接）
        run: cargo build -p main-bin --features real --locked
