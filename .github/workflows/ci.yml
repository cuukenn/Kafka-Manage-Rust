name: CI

# T092: release.yml is the only workflow and it only fires on `v*` tags, so a
# push never runs a test and the three platforms' build health stays unknown
# until release day. This workflow is the per-push gate; release.yml keeps the
# packaging job and its `contents: write` (R97).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the other two.
      fail-fast: false
      matrix:
        # Pinned to the release workflow's targets (R98) so CI and release build
        # the same images.
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # tao/wry link against the system webview; rdkafka and rusqlite need a C
      # toolchain. Same list T093 documents for Linux developers.
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            pkg-config cmake build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: actions/setup-node@v4
        with:
          # Vite 7 refuses anything below 20.19/22.12.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # main-bin embeds frontend/dist with include_dir!, so the frontend has to
      # exist before the Rust build looks at it.
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 测试
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 构建可执行文件
        run: cargo build --release -p main-bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-main-bin
          path: |
            target/release/main-bin
            target/release/main-bin.exe
          if-no-files-found: error

  # Keeps the rdkafka path compiling without a live broker: real_conformance is
  # #[ignore]d and needs the Docker cluster (R100).
  real-check:
    name: real feature check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config cmake build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 检查 real 特性
        run: cargo check -p kafka-driver --features real
