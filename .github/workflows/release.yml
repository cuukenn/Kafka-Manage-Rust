name: Release Build

# 打 tag（v*）触发：构建三平台产物并上传到对应 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 上传 release assets

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 各平台主流架构：windows-x64 / linux-x64+aarch64 / macos-arm64+x64
          # T109: macos-13 已于 2025-12-04 退役、macos-14 于 2026-11-02 退役，
          # 故 Intel 用官方替代 macos-15-intel，arm64 用 macos-15。
          - { os: windows-latest,     platform: windows, arch: x86_64, target: x86_64-pc-windows-msvc,    ext: zip }
          - { os: ubuntu-22.04,       platform: linux,   arch: x86_64, target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm,   platform: linux,   arch: aarch64, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel,     platform: macos,   arch: x86_64, target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: macos-15,           platform: macos,   arch: arm64,  target: aarch64-apple-darwin,      ext: tar.gz }

    env:
      APP_NAME: rs-kafka-ui-client # 软件名（产物名前缀）
      BIN: main-bin                 # cargo 二进制名（构建后重命名为 APP_NAME）
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      # T109: 与 ci.yml 同一份清单——tao/wry 链接系统 webview，rdkafka/rusqlite 需要 C 工具链。
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            pkg-config cmake build-essential

      - name: 提取版本（tag v0.1.0 → 0.1.0）
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # main-bin 用 include_dir 把 frontend/dist 嵌入为静态资源，必须先构建前端
      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 编译 release 二进制
        shell: bash
        run: cargo build --release -p main-bin --target "$TARGET" --locked

      - name: 准备产物文件
        shell: bash
        run: |
          OUTBIN="${APP_NAME}"
          [ "$PLATFORM" = "windows" ] && OUTBIN="${APP_NAME}.exe"
          cp "target/${TARGET}/release/${BIN}" "$OUTBIN"
          echo "OUTBIN=${OUTBIN}" >> "$GITHUB_ENV"

      # T109: bash 下的 tar 在 windows runner 上会解析到 Git 自带的 GNU tar，而 GNU tar 的
      # -a 不认 .zip（不报错，只是写一个未压缩的 tar）。Windows 产物改用 Compress-Archive。
      - name: 打包（Windows · Zip）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $name = "$env:APP_NAME-$env:VERSION-$env:PLATFORM-$env:ARCH"
          Compress-Archive -Path "$env:OUTBIN" -DestinationPath "$name.zip" -Force
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 打包（其他平台 · tar.gz）
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          NAME="${APP_NAME}-${VERSION}-${PLATFORM}-${ARCH}"
          tar -czf "${NAME}.tar.gz" "$OUTBIN"
          echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
