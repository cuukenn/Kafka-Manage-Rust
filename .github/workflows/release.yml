name: Release Build

# 打 tag（v*）触发：构建三平台产物并上传到对应 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 上传 release assets

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 各平台主流架构：windows-x64 / linux-x64+aarch64 / macos-arm64+x64
          # T109: macos-13 已于 2025-12-04 退役、macos-14 于 2026-11-02 退役，
          # 故 Intel 用官方替代 macos-15-intel，arm64 用 macos-15。
          - { os: windows-latest,     platform: windows, arch: x86_64, target: x86_64-pc-windows-msvc,    ext: zip }
          - { os: ubuntu-22.04,       platform: linux,   arch: x86_64, target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm,   platform: linux,   arch: aarch64, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel,     platform: macos,   arch: x86_64, target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: macos-15,           platform: macos,   arch: arm64,  target: aarch64-apple-darwin,      ext: tar.gz }

    env:
      APP_NAME: rs-kafka-ui-client # 软件名（产物名前缀）
      BIN: main-bin                 # cargo 二进制名（构建后重命名为 APP_NAME）
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      # T109: 与 ci.yml 同一份清单——tao/wry 链接系统 webview，rdkafka/rusqlite 需要 C 工具链。
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            pkg-config cmake build-essential

      # T110: 产物必须带 real 驱动（--features real 会拉入 rdkafka/openssl-sys）。
      # Linux 的 libssl-dev 已由上面的 apt 清单覆盖；macOS 镜像只带 openssl 1.1.1，
      # 这里显式钉住 keg-only 的 openssl@3（与 T104 在本机踩到的「默认 openssl 4.x
      # 不再导出 ENGINE API」同源，故不依赖镜像的默认发现结果）。
      - name: OpenSSL 环境（macOS）
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install openssl@3
          prefix="$(brew --prefix openssl@3)"
          echo "OPENSSL_DIR=${prefix}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      # T110/T111: Windows 镜像自带 OpenSSL 3.6.5，装在 `$env:ProgramFiles\OpenSSL`
      # （见 runner-images 的 `Install-OpenSSL.ps1` 与 `Tools.Tests.ps1`），但 import
      # 库不在 `lib\` 根下（slproweb 布局是 `lib\VC\<arch>\<runtime>\`），所以递归
      # 找 `libcrypto.lib` 而不是猜路径；找不到就失败，绝不产出「一启动就崩」的产物。
      - name: OpenSSL 环境（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @("$env:ProgramFiles\OpenSSL", "$env:ProgramFiles\OpenSSL-Win64", "C:\OpenSSL-Win64")
          $root = $roots | Where-Object { Test-Path (Join-Path $_ 'include\openssl\ssl.h') } | Select-Object -First 1
          if (-not $root) { throw "找不到 OpenSSL 开发包（候选：$($roots -join ', ')）" }
          $lib = Get-ChildItem -Path (Join-Path $root 'lib') -Filter 'libcrypto.lib' -Recurse -File -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $lib) {
            $listing = (Get-ChildItem (Join-Path $root 'lib') -Recurse -File -ErrorAction SilentlyContinue |
                        Select-Object -First 30 | ForEach-Object FullName) -join "`n"
            throw "在 $root\lib 下找不到 libcrypto.lib。已有文件：`n$listing"
          }
          "OPENSSL_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_LIB_DIR=$($lib.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_INCLUDE_DIR=$root\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          Join-Path $root 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "OpenSSL: $root  lib=$($lib.DirectoryName)"

      - name: 提取版本（tag v0.1.0 → 0.1.0）
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # main-bin 用 include_dir 把 frontend/dist 嵌入为静态资源，必须先构建前端
      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      # T110: --features real 让产物自带真实 Kafka 驱动。Mock 只是默认驱动，
      # 不带 real 的话用户下载到的二进制连不上任何真实集群（会报
      # "real Kafka driver is not compiled in"）。
      - name: 编译 release 二进制（含 real 驱动）
        shell: bash
        run: cargo build --release -p main-bin --target "$TARGET" --locked --features real

      # 先收进 staging/：Windows 还要把 OpenSSL 的 DLL 放在 exe 旁边一起发。
      - name: 准备产物文件
        shell: bash
        run: |
          OUTBIN="${APP_NAME}"
          [ "$PLATFORM" = "windows" ] && OUTBIN="${APP_NAME}.exe"
          mkdir -p staging
          cp "target/${TARGET}/release/${BIN}" "staging/${OUTBIN}"
          echo "OUTBIN=${OUTBIN}" >> "$GITHUB_ENV"

      # T109: bash 下的 tar 在 windows runner 上会解析到 Git 自带的 GNU tar，而 GNU tar 的
      # -a 不认 .zip（不报错，只是写一个未压缩的 tar）。Windows 产物改用 Compress-Archive。
      - name: 打包（Windows · Zip）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # real 驱动动态链接 OpenSSL：DLL 必须与 exe 同目录，否则用户侧启动即失败。
          # 用 glob 取而不是硬编码 -3-x64，兼容将来换主版本/架构。
          foreach ($pattern in @("libcrypto-*.dll", "libssl-*.dll")) {
            $dll = Get-ChildItem -Path (Join-Path $env:OPENSSL_DIR "bin") -Filter $pattern -File -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if (-not $dll) { throw "缺少 $pattern（$env:OPENSSL_DIR\bin）" }
            Copy-Item $dll.FullName staging\
          }
          $name = "$env:APP_NAME-$env:VERSION-$env:PLATFORM-$env:ARCH"
          Compress-Archive -Path staging\* -DestinationPath "$name.zip" -Force
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 打包（其他平台 · tar.gz）
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          NAME="${APP_NAME}-${VERSION}-${PLATFORM}-${ARCH}"
          tar -czf "${NAME}.tar.gz" -C staging "$OUTBIN"
          echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
