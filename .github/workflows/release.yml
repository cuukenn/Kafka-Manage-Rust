name: Release Build

# 打 tag（v*）触发：构建三平台产物并上传到对应 GitHub Release
on:
  push:
    tags:
      - 'v*'

# T113: build job 只需要读权限（它只上传 workflow artifact），写权限只给下面的 release job。
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 各平台主流架构：windows-x64 / linux-x64+aarch64 / macos-arm64+x64
          # T109: macos-13 已于 2025-12-04 退役、macos-14 于 2026-11-02 退役，
          # 故 Intel 用官方替代 macos-15-intel，arm64 用 macos-15。
          - { os: windows-latest,     platform: windows, arch: x86_64, target: x86_64-pc-windows-msvc,    ext: zip }
          - { os: ubuntu-22.04,       platform: linux,   arch: x86_64, target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm,   platform: linux,   arch: aarch64, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-15-intel,     platform: macos,   arch: x86_64, target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: macos-15,           platform: macos,   arch: arm64,  target: aarch64-apple-darwin,      ext: tar.gz }

    env:
      APP_NAME: rs-kafka-ui-client # 软件名（产物名前缀）
      BIN: main-bin                 # cargo 二进制名（构建后重命名为 APP_NAME）
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v4

      # T112: 系统依赖抽成复合动作，与 ci.yml 共用同一份，避免继续漂移（R98 的同源要求）。
      # T119: 里面只剩 Linux 的 webkit/gtk —— OpenSSL 改走 ssl-vendored，三平台都不再需要。
      - uses: ./.github/actions/real-deps

      - name: 提取版本（tag v0.1.0 → 0.1.0）
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # main-bin 用 include_dir 把 frontend/dist 嵌入为静态资源，必须先构建前端
      - name: 构建前端
        run: |
          cd frontend
          npm ci
          npm run build

      # T110: --features real 让产物自带真实 Kafka 驱动。Mock 只是默认驱动，
      # 不带 real 的话用户下载到的二进制连不上任何真实集群（会报
      # "real Kafka driver is not compiled in"）。
      # T120: vendored OpenSSL 在 MSVC 上要跑 nmake/cl，而 Windows 镜像默认没把 VS 开发环境
      # 放进 PATH（工具列表里只有 CMake，没有 nmake/vcvars）—— 先把它拉进来。
      - name: MSVC 开发环境（Windows）
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # T121: v0.1.5 的 Windows 失败正文显示 rustc 调的是 "C:\Program Files\Git\usr\bin\link.exe"
      # —— MSYS 的「建硬链接」工具，不是 MSVC 链接器（所以报 "extra operand"）。显式给出绝对路径，
      # PATH 顺序就不再参与决策；顺带把 PATH 上实际解析到的那个打成 annotation 留证据。
      - name: 钉住 MSVC 链接器（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $link = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $link)) { throw "VCToolsInstallDir 里没有 link.exe：$link" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          $first = (where.exe link.exe | Select-Object -First 1)
          Write-Host "::warning::MSVC link.exe pinned to $link | PATH resolves link.exe to $first"

      # T120: 匿名身份读不到 job 日志（logs 端点 404），但 annotations 读得到。
      # 失败时把日志尾部打成 ::error::，不用人肉贴日志也能定位真正的报错。
      - name: 编译 release 二进制（含 real 驱动）
        shell: bash
        run: |
          set +e
          cargo build --release -p main-bin --target "$TARGET" --locked --features real 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 25 build.log | while IFS= read -r line; do
              line="${line//%/25}"; line="${line//\"/%22}"
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"

      # 先收进 staging/：T119 之后各平台都只有裸二进制（OpenSSL 已静态编进去）。
      - name: 准备产物文件
        shell: bash
        run: |
          OUTBIN="${APP_NAME}"
          [ "$PLATFORM" = "windows" ] && OUTBIN="${APP_NAME}.exe"
          mkdir -p staging
          cp "target/${TARGET}/release/${BIN}" "staging/${OUTBIN}"
          echo "OUTBIN=${OUTBIN}" >> "$GITHUB_ENV"

      # T109: bash 下的 tar 在 windows runner 上会解析到 Git 自带的 GNU tar，而 GNU tar 的
      # -a 不认 .zip（不报错，只是写一个未压缩的 tar）。Windows 产物改用 Compress-Archive。
      - name: 打包（Windows · Zip）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # T119: OpenSSL 已由 ssl-vendored 静态编进 exe，不再需要随包发 DLL。
          # T119: 名称-版本号-架构-格式，架构用完整 target 三元组（唯一，不会 aarch64 撞名）。
          $name = "$env:APP_NAME-$env:VERSION-$env:TARGET"
          Compress-Archive -Path staging\* -DestinationPath "$name.zip" -Force
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 打包（其他平台 · tar.gz）
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          # T119: 名称-版本号-架构-格式（与 Windows 步同一套命名）。
          NAME="${APP_NAME}-${VERSION}-${TARGET}"
          tar -czf "${NAME}.tar.gz" -C staging "$OUTBIN"
          echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"

      # T113: 只把产物存成 workflow artifact。以前 5 个 matrix job 各自调 action-gh-release，
      # 并发创建同一个 release 会撞 already_exists，正文也被各追加一次（v0.1.0 的 release body
      # 里 "Full Changelog" 重复了 5 行，就是实证）。现在统一交给下面的 release job。
      - name: 上传产物（workflow artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  # T113: 收齐 5 个产物后**只创建一次** release——没有并发，正文只有一份。
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 创建 release 并上传 assets
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布产物
        run: ls -lh dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
