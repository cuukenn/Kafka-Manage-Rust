[workspace]
resolver = "3"
members = [
    "crates/kafka-core",
    "crates/kafka-driver",
    "crates/kafka-app",
    "crates/webview-bridge",
    "crates/main-bin",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# async runtime / streams
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# storage
rusqlite = { version = "0.40", features = ["bundled"] }

# ui shell
tao = "0.37"
wry = "0.57"
include_dir = "0.7"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# errors
thiserror = "2.0"
anyhow = "1.0"

# misc
uuid = { version = "1.28", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
tempfile = "3"

# benchmarks
criterion = { version = "0.7", features = ["async_tokio"] }

# real kafka driver (feature-gated: needs cmake + C toolchain)
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "curl"] }

# internal crates
kafka-core = { path = "crates/kafka-core" }
kafka-driver = { path = "crates/kafka-driver" }
kafka-app = { path = "crates/kafka-app" }
webview-bridge = { path = "crates/webview-bridge" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
