# Single-node Kafka (KRaft, no ZooKeeper) for the Stage 6 "real" driver.
#
# Run from this directory:   docker compose up -d
# Follow the logs:           docker compose logs -f kafka
# Stop:                      docker compose down
# Wipe all data:             docker compose down -v
#
# The broker is reachable from the host at localhost:9092 (PLAINTEXT), which is
# what the UI stores as `bootstrapServers` for a real cluster.
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: rs-kafka-ui-dev
    ports:
      - "9092:9092"
    environment:
      # --- identity -------------------------------------------------------
      KAFKA_NODE_ID: 1
      # One process plays both roles: no separate controller quorum to run.
      KAFKA_PROCESS_ROLES: broker,controller
      # Fixed so repeated `down -v && up` cycles keep the same cluster id.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # --- listeners ------------------------------------------------------
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # localhost (not the container name): the Rust client runs on the host.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # --- single-broker friendly defaults --------------------------------
      # RF=1 everywhere: a one-broker cluster cannot host replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
